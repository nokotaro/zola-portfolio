{% macro search(input="search-input", results="search-results", status="search-status") %}
<article class="panel is-link">
  <div class="panel-block">
    <p class="control has-icons-left">
      <input id="{{ input }}" class="input" type="search" placeholder="search" aria-label="Search site"
        aria-controls="{{ results }}" oninput="doSearch()">
      <span class="icon is-left">
        <i class="fas fa-search" aria-hidden="true"></i>
      </span>
    </p>
  </div>
  <p id="{{ status }}" class="panel-block" role="status" aria-live="polite" hidden></p>
  <div id="{{ results }}" hidden></div>
</article>
{% endmacro %}

{% macro search_init(input="search-input", results="search-results", status="search-status") %}
{% if config.build_search_index %}
<script>
  function doSearch() {
    const value = document.getElementById("{{ input }}").value.trim();
    const resultsContainer = document.getElementById("{{ results }}");
    const status = document.getElementById("{{ status }}");

    resultsContainer.innerHTML = "";
    resultsContainer.hidden = true;
    status.textContent = "";
    status.hidden = true;

    if (!value) {
      return;
    }

    var options = {
      bool: "AND",
      fields: {
        title: { boost: 2 },
        body: { boost: 1 },
      }
    };
    var index = elasticlunr.Index.load(window.searchIndex);
    const results = index.search(value, options).filter(function (result) {
      return result.doc.body && result.doc.body.trim();
    });

    if (results.length === 0) {
      status.textContent = "No results found.";
      status.hidden = false;
      return;
    }

    status.textContent = results.length === 1 ? "1 result found." : `${results.length} results found.`;
    status.hidden = false;
    resultsContainer.hidden = false;

    for (let i = 0; i < results.length; i++) {
      const url = results[i].ref;
      const title = results[i].doc.title;
      const elemlink = document.createElement('a');
      elemlink.className = "panel-block";
      elemlink.textContent = title;
      elemlink.setAttribute('href', url);
      resultsContainer.appendChild(elemlink);
    }
  }
</script>
{% else %}
<script type="module">
  import { search, default as init } from "{{ get_url(path='/tinysearch_engine.js') | safe }}";
  window.search = search;
  async function run() { await init("{{ get_url(path='/tinysearch_engine_bg.wasm') | safe }}"); }
  run();
</script>
<script>
  function doSearch() {
    let value = document.getElementById("{{ input }}").value;
    const results = search(value, 5);
    let ul = document.getElementById("{{ results }}");
    ul.innerHTML = "";
    for (i = 0; i < results.length; i++) {
      let [title, url] = results[i];
      let elemlink = document.createElement('a');
      elemlink.className = "panel-block";
      elemlink.innerHTML = title;
      elemlink.setAttribute('href', url);
      ul.appendChild(elemlink);
    }
  }
</script>
{% endif %}
{% endmacro %}
